# Avisos semanales de dependencias nuevas o con vulnerabilidades (abre PR; nada se fusiona solo).
version: 2
updates:
  - package-ecosystem: github-actions # acciones fijadas por SHA en .github/workflows
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip # requirements.txt / requirements.lock (pip-compile con hashes)
    directory: /lector
    schedule:
      interval: weekly

  - package-ecosystem: pub # app Flutter
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: gradle # proyecto Android de la app
    directory: /app/android
    schedule:
      interval: weekly
