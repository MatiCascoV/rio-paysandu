name: Tests del lector

on:
  push:
    paths: ["lector/**", "pytest.ini", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lector/requirements.txt
      - run: pip install -r lector/requirements.txt
      - run: python -m pytest -q
