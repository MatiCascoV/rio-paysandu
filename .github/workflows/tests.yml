name: Tests del lector

on:
  push:
    # data/umbrales.json se edita a mano: un test controla que siga siendo válido.
    paths: ["lector/**", "data/umbrales.json", "pytest.ini", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lector/requirements.txt
            lector/requirements-dev.txt
      - run: pip install --require-hashes --only-binary=:all: -r lector/requirements.txt -r lector/requirements-dev.txt
      - run: python -m pytest -q
