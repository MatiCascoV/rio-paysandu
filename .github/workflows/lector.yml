name: Lector CARU

# Cómo se mantiene corriendo:
# El horario programado de GitHub (schedule) no es confiable: puede demorar horas
# o no disparar. Por eso este trabajo no hace una sola lectura: se queda leyendo
# CARU cada 10 minutos durante unas 5 horas y, antes de terminar, lanza la corrida
# siguiente. Así hay siempre una corrida activa. El horario queda solo como
# respaldo, para volver a arrancar la cadena si alguna vez se corta.

on:
  schedule:
    - cron: "10,40 * * * *" # respaldo (hora UTC)
  workflow_dispatch: # arranque a mano: pestaña Actions o `gh workflow run lector.yml`
    inputs: # solo para pruebas; sin tocarlos se usan los valores normales
      minutos_de_trabajo:
        description: Cuántos minutos se queda leyendo antes de lanzar la corrida siguiente
        default: "320"
      minutos_entre_lecturas:
        description: Minutos entre una lectura y la siguiente
        default: "10"

# Sin permisos por defecto: cada trabajo pide solo lo que usa.
permissions: {}

# Nunca dos a la vez: una corrida nueva espera a que termine la que está activa.
concurrency:
  group: lector
  cancel-in-progress: false

env:
  MINUTOS_ENTRE_LECTURAS: ${{ inputs.minutos_entre_lecturas || 10 }}
  MINUTOS_DE_TRABAJO: ${{ inputs.minutos_de_trabajo || 320 }} # el límite de GitHub por trabajo es 360

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write # guardar data/ en el repositorio
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lector/requirements.lock

      # Versiones fijas y verificadas por hash: un paquete alterado en PyPI no se instala.
      - run: pip install --require-hashes -r lector/requirements.lock

      - name: Leer CARU cada 10 minutos y guardar data/ cuando cambia
        run: |
          # Las entradas del arranque a mano llegan como texto: solo se aceptan números
          # razonables (si no, este trabajo falla y "relanzar" arranca uno con los valores normales).
          for v in "$MINUTOS_ENTRE_LECTURAS" "$MINUTOS_DE_TRABAJO"; do
            if ! [[ "$v" =~ ^[0-9]{1,3}$ ]]; then
              echo "::error::Entrada inválida: '$v' (se esperan de 1 a 3 cifras)"; exit 1
            fi
          done
          entre=$(( 10#$MINUTOS_ENTRE_LECTURAS )); trabajo=$(( 10#$MINUTOS_DE_TRABAJO ))
          if [ "$entre" -lt 5 ]; then
            echo "::error::minutos_entre_lecturas debe ser al menos 5 (vino $entre)"; exit 1
          fi
          if [ "$trabajo" -lt 1 ] || [ $(( trabajo + entre )) -gt 330 ]; then
            # Tiene que entrar en timeout-minutes (350) contando la última espera y lectura.
            echo "::error::minutos_de_trabajo debe ser al menos 1 y, sumado a minutos_entre_lecturas, como mucho 330 (vino $trabajo + $entre)"; exit 1
          fi

          git config user.name "lector-caru[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fin=$(( $(date +%s) + trabajo * 60 ))
          fallos=0 # pasadas seguidas en las que el lector terminó con error
          while :; do
            # Partir siempre de lo publicado en main (por ejemplo, umbrales editados a mano).
            # Si quedó un commit sin subir de la pasada anterior, se descarta: el lector
            # vuelve a generar data/ con lo que haya en CARU.
            if ! { git fetch --quiet origin main && git reset --quiet --hard origin/main; }; then
              echo "::warning::No se pudo traer el repositorio"
            fi

            # Si una lectura falla, se sigue: la próxima pasada lo vuelve a intentar.
            codigo=0
            timeout 180 python lector/lector.py || codigo=$?
            if [ "$codigo" -ne 0 ]; then
              fallos=$(( fallos + 1 ))
              echo "::warning::El lector falló en esta pasada (código $codigo; $fallos seguidas)"
            else
              fallos=0
            fi

            rm -f data/*.tmp # restos de una escritura cortada por timeout
            git add data
            if ! git diff --cached --quiet; then
              git commit --quiet -m "Datos de CARU $(TZ=America/Montevideo date '+%d/%m/%Y %H:%M')"
              if ! git push --quiet; then
                if ! { git pull --rebase --quiet && git push --quiet; }; then
                  git rebase --abort 2>/dev/null || true
                  echo "::warning::No se pudieron subir los datos"
                fi
              fi
            fi

            # Unas 2 horas seguidas sin poder leer CARU: el trabajo termina en error para
            # que GitHub mande el correo de falla. "relanzar" arranca la corrida siguiente igual.
            if [ "$fallos" -ge 12 ]; then
              echo "::error::El lector falló $fallos pasadas seguidas"; exit 1
            fi
            [ "$(date +%s)" -ge "$fin" ] && break
            sleep $(( entre * 60 ))
          done

  # Trabajo aparte para que el token que puede lanzar workflows no conviva con
  # el código del lector ni con dependencias de terceros: no hace checkout ni pip.
  relanzar:
    needs: leer
    if: always() # también si la lectura falló o se canceló, para que la cadena no se corte
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # lanzar la corrida siguiente
    steps:
      - name: Lanzar la corrida siguiente
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lector.yml --repo "$GITHUB_REPOSITORY" --ref main
