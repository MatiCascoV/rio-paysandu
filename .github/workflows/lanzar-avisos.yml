name: Lanzar avisos

# Cuándo corre: cuando GitHub Pages termina de publicar un commit de la rama datos
# (el workflow interno "pages-build-deployment"). Ver docs/fase-4-lanzar-avisos.md.
#
# Qué hace: lanza avisos.yml una vez por cada commit de datos que cambió
# data/actual.json desde la publicación anterior de Pages que salió bien. Casi
# siempre es uno solo; si Pages salteó o falló alguna, también lanza esos, porque
# lector/avisos.py compara cada commit con el anterior y un commit sin lanzar
# perdería su urgente. Antes confirma que la URL pública ya sirve el dato, para que
# la app no muestre el genérico "hay novedades".
#
# Por qué acá y no en lector.yml: así el trabajo que procesa lo que manda CARU sigue
# sin poder lanzar workflows. "revisar" lee datos pero solo puede leer la API;
# "lanzar" puede lanzar workflows pero no trae el repositorio ni datos: solo recibe
# SHAs y los vuelve a validar. Sin acciones de terceros: solo bash, git, jq, curl y
# gh del runner.
#
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
# - LANZAR_AVISOS=false corta todo (este workflow no hace nada). Sin la variable, anda.
# - AVISOS_REALES=true manda a los temas reales. Sin ella, todo va a los temas prueba-.
# - Mientras falten GCP_WIF_PROVIDER o GCP_SA_EMAIL (paso 6), no se lanza nada: solo
#   queda en el resumen qué se habría lanzado ("solo mirar").
#
# workflow_run siempre usa este archivo tal como está en main.

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

# Sin permisos por defecto: cada trabajo pide solo lo que usa.
permissions: {}

# Un grupo por commit (no uno solo): GitHub deja una sola corrida en espera por grupo
# y cancela la que esperaba, y eso perdería commits. Las listas de dos corridas no se
# pisan (cada una va desde la publicación anterior hasta la suya).
concurrency:
  group: lanzar-avisos-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  revisar:
    # Solo publicaciones que salieron bien, de la rama datos de este mismo repositorio,
    # y si el dueño no cortó el lanzador.
    if: >-
      vars.LANZAR_AVISOS != 'false' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'datos' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read # listar las corridas de pages-build-deployment
    outputs:
      commits: ${{ steps.lista.outputs.commits }}
      pages: ${{ steps.pages.outputs.pages }}
    env:
      URL_ACTUAL: https://maticascov.github.io/rio-paysandu/data/actual.json # la misma que usa la app
      MAX_COMMITS: "12" # unas 2 horas de publicaciones
      ACTUAL: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Armar la lista de commits a lanzar
        id: lista
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID_PAGES: ${{ github.event.workflow_run.workflow_id }}
          CREADA: ${{ github.event.workflow_run.created_at }}
          TERMINADA: ${{ github.event.workflow_run.updated_at }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # Lo que llega del evento se valida antes de usarlo.
          [[ "$ACTUAL" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head_sha inválido"; exit 1; }
          [[ "$ID_PAGES" =~ ^[0-9]+$ ]] || { echo "::error::workflow_id inválido"; exit 1; }
          formato_fecha='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          [[ "$CREADA" =~ $formato_fecha ]] || { echo "::error::created_at inválido"; exit 1; }
          [[ "$TERMINADA" =~ $formato_fecha ]] || TERMINADA=""
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::repositorio inválido"; exit 1; }

          # Publicación anterior de Pages que salió bien (la más nueva antes de esta).
          # CREADA ya tiene formato fijo de fecha: no puede romper el filtro de jq.
          anterior=$(gh api "repos/$REPO/actions/workflows/$ID_PAGES/runs?branch=datos&status=success&per_page=50" \
            --jq "[.workflow_runs[] | select(.created_at < \"$CREADA\")] | sort_by(.created_at) | last | .head_sha // empty") \
            || anterior=""

          # Historia de datos, sin token: el repositorio es público. No se corre nada de
          # lo que trae: solo git rev-list, git log y git show de un JSON.
          git init --quiet datos
          cd datos
          timeout 60 git fetch --quiet --no-tags --depth=300 "https://github.com/$REPO.git" \
            "+refs/heads/datos:refs/remotes/origin/datos"
          if ! git merge-base --is-ancestor "$ACTUAL" origin/datos 2>/dev/null; then
            echo "::error::El commit $ACTUAL no está en datos (o está a más de 300 commits de la punta)"
            exit 1
          fi

          if [[ "$anterior" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$anterior" "$ACTUAL" 2>/dev/null; then
            # Del más viejo al más nuevo; solo los que cambiaron actual.json.
            mapfile -t lista < <(git rev-list --reverse "$anterior..$ACTUAL" -- data/actual.json)
            desde="desde la publicación anterior ${anterior:0:7}"
          else
            echo "::warning::No se encontró la publicación anterior de Pages: se mira solo este commit"
            lista=()
            if [ "$(git log -1 --format=%H "$ACTUAL" -- data/actual.json)" = "$ACTUAL" ]; then
              lista=("$ACTUAL")
            fi
            desde="solo este commit (no se encontró la publicación anterior)"
          fi

          if [ "${#lista[@]}" -gt "$MAX_COMMITS" ]; then
            echo "::warning::Hay ${#lista[@]} commits sin lanzar; se lanzan solo los últimos $MAX_COMMITS"
            lista=("${lista[@]: -$MAX_COMMITS}")
          fi
          echo "commits=${lista[*]}" >> "$GITHUB_OUTPUT"

          # Para la semana de prueba: cuánto tardó el evento desde el push.
          empujado=$(git log -1 --format=%cI "$ACTUAL")
          ahora=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          demora=$(( $(date -d "$ahora" +%s) - $(date -d "$empujado" +%s) )) || demora=""
          {
            echo "## Lanzar avisos"
            echo
            echo "- Publicación de Pages: \`$ACTUAL\` (corrida de $CREADA a ${TERMINADA:-?})"
            echo "- Commit hecho: $empujado; este trabajo arrancó: $ahora${demora:+ (${demora} s después del commit)}"
            echo "- Commits que cambiaron actual.json, $desde: ${lista[*]:-ninguno}"
          } >> "$GITHUB_STEP_SUMMARY"

      # El evento ya dice que Pages terminó; esto confirma que la URL pública sirve el
      # dato (o uno más nuevo) antes de mandar el push. Si en 3 minutos no aparece, se
      # lanza igual: es peor callar un urgente que mostrar el genérico.
      - name: Esperar a que Pages sirva el dato
        id: pages
        if: steps.lista.outputs.commits != ''
        timeout-minutes: 4
        run: |
          cd datos
          a_epoca() {  # fecha ISO con offset -> segundos, o nada si no tiene ese formato
            [[ "$1" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]] \
              && date -d "$1" +%s 2>/dev/null
          }
          generado() {  # el campo generado de un actual.json que llega por la entrada
            jq -r '.generado // empty' 2>/dev/null | head -c 40
          }
          esperado=$(a_epoca "$(git show "$ACTUAL:data/actual.json" | generado)")
          if [ -z "$esperado" ]; then
            echo "::warning::El actual.json del commit no trae una fecha generado válida; no se puede verificar Pages"
            echo "pages=sin_verificar" >> "$GITHUB_OUTPUT"
            echo "- Pages: no se pudo verificar (el commit no trae generado válido)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for intento in $(seq 1 18); do  # 18 x 10 s = 3 minutos
            servido=$(a_epoca "$(curl -fsS --max-time 10 "$URL_ACTUAL" | generado)")
            if [ -n "$servido" ] && [ "$servido" -ge "$esperado" ]; then
              echo "Pages ya sirve el dato (intento $intento)"
              echo "pages=publicado" >> "$GITHUB_OUTPUT"
              echo "- Pages: ya sirve el dato (intento $intento de 18)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Pages no mostró el dato nuevo en 3 minutos; se lanza igual"
          echo "pages=sin_confirmar" >> "$GITHUB_OUTPUT"
          echo "- Pages: no mostró el dato en 3 minutos; se lanza igual" >> "$GITHUB_STEP_SUMMARY"

  # Trabajo aparte: el único con permiso de lanzar workflows. Sin checkout, sin datos,
  # sin acciones de terceros: solo gh y bash del runner.
  lanzar:
    needs: revisar
    if: needs.revisar.outputs.commits != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # lanzar avisos.yml (incluye leer sus corridas)
    steps:
      - name: Lanzar avisos.yml por cada commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMITS: ${{ needs.revisar.outputs.commits }}
          # Temas reales solo con AVISOS_REALES=true; cualquier otra cosa, temas prueba-.
          REALES: ${{ vars.AVISOS_REALES }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
        run: |
          if [ "$REALES" = "true" ]; then prueba=false; else prueba=true; fi
          read -r -a lista <<< "$COMMITS"
          if [ "${#lista[@]}" -gt 12 ]; then echo "::error::Demasiados commits en la lista"; exit 1; fi
          for commit in "${lista[@]}"; do
            if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Commit inválido en la lista"; exit 1
            fi
          done

          # Sin la identidad federada (paso 6) avisos.yml no puede enviar nada: lanzarlo
          # solo llenaría Actions de corridas inútiles (unas 70 por día). Mientras tanto,
          # este workflow queda en "solo mirar": cuenta qué habría lanzado y termina bien.
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SA_EMAIL" ]; then
            echo "::notice::Solo mirar: faltan GCP_WIF_PROVIDER o GCP_SA_EMAIL; no se lanza avisos.yml"
            {
              echo "- Lanzamiento: **no** (solo mirar: faltan las variables GCP_WIF_PROVIDER / GCP_SA_EMAIL del paso 6)"
              echo "- Se habría lanzado avisos.yml con prueba=$prueba para: ${lista[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Para no lanzar dos veces el mismo commit (re-corrida de este workflow, o
          # alguien que lo lanzó a mano): avisos.yml pone el commit en el nombre de la
          # corrida (run-name). Si la consulta falla se sigue sin ella: las listas de dos
          # corridas no se pisan, así que lo normal es que no haya repetidos.
          titulos=$(gh api "repos/$REPO/actions/workflows/avisos.yml/runs?per_page=100" \
            --jq '.workflow_runs[].display_title') || titulos=""

          fallos=0
          echo "- Lanzamiento (prueba=$prueba):" >> "$GITHUB_STEP_SUMMARY"
          for commit in "${lista[@]}"; do
            if grep -qxF "Avisos $commit prueba=$prueba" <<< "$titulos"; then
              echo "Ya hay una corrida de avisos.yml para $commit (prueba=$prueba): no se lanza otra"
              echo "  - \`$commit\`: ya estaba lanzado" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if gh workflow run avisos.yml --repo "$REPO" --ref main \
                 -f commit="$commit" -f prueba="$prueba"; then
              echo "Lanzado avisos.yml para $commit (prueba=$prueba)"
              echo "  - \`$commit\`: lanzado" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::No se pudo lanzar avisos.yml para $commit"
              echo "  - \`$commit\`: **falló el lanzamiento**" >> "$GITHUB_STEP_SUMMARY"
              fallos=$((fallos + 1))
            fi
          done
          [ "$fallos" -eq 0 ]

  # Si algo falló, un issue (como "avisar" en lector.yml): puede haber un urgente sin
  # lanzar. Para recuperarlo alcanza con "Re-run failed jobs": la revisión de nombres de
  # corrida evita repetir los commits que ya salieron. La revisión local de la app
  # sigue de respaldo.
  avisar:
    needs: [revisar, lanzar]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir o comentar el issue "No se lanzaron los avisos"
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: avisos-falla
        run: |
          corrida="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cuerpo="La corrida $corrida de Lanzar avisos falló: puede haber un aviso que no salió. Revisá el registro y, si corresponde, usá Re-run failed jobs (no repite los commits que ya se lanzaron). La revisión local de la app sigue de respaldo."
          gh label create "$ETIQUETA" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Falla al lanzar avisos push" 2>/dev/null || true
          numero=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$ETIQUETA" \
            --json number --jq '.[0].number // empty')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --repo "$GITHUB_REPOSITORY" --body "$cuerpo"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "No se lanzaron los avisos" \
              --label "$ETIQUETA" --body "$cuerpo"
          fi
