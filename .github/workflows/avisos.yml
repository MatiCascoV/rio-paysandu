name: Avisos push
# El nombre de cada corrida lleva el commit: así lanzar-avisos.yml sabe si ya se lanzó
# y en la pestaña Actions se ve qué publicación avisó cada una.
run-name: Avisos ${{ inputs.commit }} prueba=${{ inputs.prueba }}

# Qué hace (docs/fase-4-avisos-push.md, paso 7):
# Recibe el commit de datos que acaba de publicar el lector y lector/avisos.py decide,
# mirando el historial de data/actual.json, si corresponde un aviso urgente (el nivel
# SUBIÓ a alerta o a evacuación) y/o el resumen del día (una vez por día, con nivel de
# atención o más). Por cada uno manda por FCM un mensaje push SIN TEXTO a su tema;
# el teléfono baja actual.json y arma el aviso él solo. Con nivel normal no sale nada.
#
# Credencial: identidad federada de GitHub (OIDC) contra Google Cloud, sin clave
# JSON guardada en ningún lado. La cuenta de servicio solo puede enviar mensajes de
# FCM y Google solo la entrega a este archivo (avisos.yml) corriendo desde main: por
# eso este workflow se lanza siempre con --ref main y siempre corre el código de main.
#
# Dos trabajos, como "relanzar" en lector.yml: "decidir" lee los datos y corre código
# del repositorio, pero no puede pedir credenciales; "enviar" puede pedirlas, pero no
# trae el repositorio ni corre nada de él: solo recibe avisar/urgente/resumen/fuente
# ya validados.

on:
  workflow_dispatch: # lo lanza lanzar-avisos.yml cuando Pages publica, o alguien a mano
    inputs:
      commit:
        description: SHA completo (40 caracteres) del commit de datos a avisar
        required: true
        type: string
      prueba:
        description: Enviar a los temas de prueba (prefijo prueba-) en vez de los reales
        type: boolean
        # Un lanzamiento a mano va a los temas de prueba salvo que se destilde a propósito.
        default: true

# Sin permisos por defecto: cada trabajo pide solo lo que usa.
permissions: {}

# Nunca dos corridas del mismo commit a la vez. Un grupo por commit y no uno solo:
# GitHub deja una sola corrida en espera por grupo y cancela la que esperaba si llega
# otra, y como la decisión no guarda estado (sale del historial de data/actual.json),
# la cancelada perdía su urgente o su resumen (por ejemplo, una prueba a mano que
# llegaba justo con la subida real). Corridas de commits distintos no se pisan: cada
# una decide sobre su propio commit y los temas son independientes.
# Si un envío falla no hay reintentos: el aviso llega por la revisión local de la app.
concurrency:
  group: avisos-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  decidir:
    runs-on: ubuntu-latest
    # Traer historia + decidir: con 8 minutos sobra.
    timeout-minutes: 8
    permissions:
      contents: read # checkout y git fetch del historial de datos; sin id-token
    outputs:
      # Solo valores de formato fijo: "enviar" los vuelve a validar igual.
      avisar: ${{ steps.decidir.outputs.avisar }}
      urgente: ${{ steps.decidir.outputs.urgente }}
      resumen: ${{ steps.decidir.outputs.resumen }}
      fuente: ${{ steps.decidir.outputs.fuente }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token de GitHub no queda guardado en .git/config: el repositorio es
          # público y los fetch de abajo no lo necesitan.
          persist-credentials: false

      - name: Validar la entrada y traer el historial de datos
        id: commits
        timeout-minutes: 3
        env:
          COMMIT: ${{ inputs.commit }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # La entrada llega como texto libre: solo se acepta un SHA completo en
          # minúsculas, antes de pasárselo a git o a cualquier otra cosa.
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::La entrada commit tiene que ser un SHA completo de 40 caracteres hexadecimales en minúsculas"
            exit 1
          fi

          # Historial acotado: el lector lanza este workflow apenas publica, así que el
          # commit está cerca de la punta. 500 commits son días de datos: alcanzan para
          # que lector/avisos.py encuentre el nivel anterior con dato y todas las
          # publicaciones del mismo día.
          timeout 60 git fetch --quiet --no-tags --depth=500 origin \
            "+refs/heads/main:refs/remotes/origin/main"
          # La rama datos llega en el paso 5; hasta entonces los datos viven en main.
          # ls-remote --exit-code devuelve 2 si la rama no existe; otro código es un error.
          ramas=(origin/main)
          codigo=0
          timeout 60 git ls-remote --exit-code --heads origin datos >/dev/null || codigo=$?
          if [ "$codigo" -eq 0 ]; then
            timeout 60 git fetch --quiet --no-tags --depth=500 origin \
              "+refs/heads/datos:refs/remotes/origin/datos"
            ramas+=(origin/datos)
          elif [ "$codigo" -ne 2 ]; then
            echo "::error::No se pudo consultar si existe la rama datos (código $codigo)"
            exit 1
          fi

          # Solo se avisa de commits publicados en main o en datos: un SHA de un fork
          # o de una rama cualquiera no dispara nada.
          publicado=false
          if git cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
            for rama in "${ramas[@]}"; do
              if git merge-base --is-ancestor "$COMMIT" "$rama"; then
                publicado=true; break
              fi
            done
          fi
          if [ "$publicado" != true ]; then
            echo "::error::El commit $COMMIT no está en ${ramas[*]} (o está a más de 500 commits de la punta); no se envía nada"
            exit 1
          fi

      # Sin cache y sin pip install: lector/avisos.py usa solo la biblioteca estándar.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Este trabajo no tiene id-token: write, así que el código que lee los datos no
      # puede pedir ningún token, ni de GitHub para Google ni de Google.
      # Contrato: lee data/actual.json en el commit y recorre su historial hacia atrás
      # (nivel anterior con dato y publicaciones del mismo día). Escribe en
      # $GITHUB_OUTPUT avisar=true|false, urgente=alerta|evacuacion|ninguno,
      # resumen=true|false y fuente=prefectura|estacion|ninguna; termina con 0 si
      # decidió y con 2 si no pudo (el trabajo falla).
      - name: Decidir si hay que avisar
        id: decidir
        timeout-minutes: 3
        env:
          COMMIT: ${{ inputs.commit }}
        run: python lector/avisos.py --commit "$COMMIT"

      # Resumen de lo decidido en todas las salidas (también si algo falló o se canceló).
      # Si hay que avisar, qué se mandó a qué destino lo cuenta el resumen de "enviar".
      - name: Resumen
        if: always()
        env:
          COMMIT: ${{ inputs.commit }}
          PRUEBA: ${{ inputs.prueba }}
          RESULTADO_COMMITS: ${{ steps.commits.outcome }}
          RESULTADO_DECIDIR: ${{ steps.decidir.outcome }}
          AVISAR: ${{ steps.decidir.outputs.avisar }}
          URGENTE: ${{ steps.decidir.outputs.urgente }}
          RESUMEN: ${{ steps.decidir.outputs.resumen }}
          FUENTE: ${{ steps.decidir.outputs.fuente }}
        run: |
          # Lo que no tiene el formato esperado no se copia al resumen.
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || COMMIT="(inválido)"
          [[ "$AVISAR" =~ ^(true|false)$ ]] || AVISAR="(sin decidir)"
          [[ "$URGENTE" =~ ^(alerta|evacuacion|ninguno)$ ]] || URGENTE="(sin decidir)"
          [[ "$RESUMEN" =~ ^(true|false)$ ]] || RESUMEN="(sin decidir)"
          [[ "$FUENTE" =~ ^(prefectura|estacion|ninguna)$ ]] || FUENTE="(sin decidir)"

          if [ "$RESULTADO_COMMITS" != success ]; then
            enviado="no: el commit no es válido o no está publicado en main/datos"
          elif [ "$RESULTADO_DECIDIR" != success ]; then
            enviado="no: lector/avisos.py no pudo decidir"
          elif [ "$AVISAR" != true ]; then
            enviado="no: no hay aviso urgente ni resumen del día que mandar"
          else
            enviado="hay que avisar: lo hace el trabajo enviar (ver su resumen abajo)"
          fi
          if [ "$PRUEBA" = "false" ]; then
            etiqueta="no (temas reales)"
          else
            etiqueta="sí (temas con prefijo prueba-)"
          fi

          {
            echo "## Avisos push"
            echo
            echo "- Commit: \`$COMMIT\`"
            echo "- Decisión: avisar=$AVISAR, urgente=$URGENTE, resumen=$RESUMEN, fuente=$FUENTE"
            echo "- Prueba: $etiqueta"
            echo "- Envío: $enviado"
          } >> "$GITHUB_STEP_SUMMARY"

  # Trabajo aparte para que la credencial de envío no conviva con el código del
  # repositorio ni con los datos: sin checkout, sin setup-python, sin acciones de
  # terceros salvo la de autenticar. Solo bash, jq y curl del runner.
  enviar:
    needs: decidir
    if: needs.decidir.outputs.avisar == 'true'
    runs-on: ubuntu-latest
    # Revisar + autenticar + hasta tres envíos (15 s como máximo cada uno): con 5
    # minutos sobra.
    timeout-minutes: 5
    permissions:
      id-token: write # pedir el token OIDC que Google cambia por un token de FCM; sin contents
    steps:
      - name: Revisar la decisión y la configuración de envío
        id: config
        env:
          AVISAR: ${{ needs.decidir.outputs.avisar }}
          URGENTE: ${{ needs.decidir.outputs.urgente }}
          RESUMEN: ${{ needs.decidir.outputs.resumen }}
          FUENTE: ${{ needs.decidir.outputs.fuente }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
          PROYECTO: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          # Lo que llega de "decidir" se valida antes de usarlo, aunque el if del
          # trabajo ya lo haya mirado. Además tiene que ser coherente: avisar=true
          # solo con un urgente o un resumen, y fuente solo (y siempre) con resumen.
          if [ "$AVISAR" != true ] \
            || ! [[ "$URGENTE" =~ ^(alerta|evacuacion|ninguno)$ ]] \
            || ! [[ "$RESUMEN:$FUENTE" =~ ^(true:(prefectura|estacion)|false:ninguna)$ ]] \
            || { [ "$URGENTE" = ninguno ] && [ "$RESUMEN" != true ]; }; then
            echo "::error::La decisión que llegó de decidir no tiene el formato esperado (avisar=true con urgente alerta/evacuacion y/o resumen=true con fuente prefectura/estacion)"
            exit 1
          fi

          # Una re-corrida ("Re-run jobs") usa las mismas salidas de decidir: volvería
          # a mandar lo que ya salió (por ejemplo el urgente, si solo falló el resumen).
          # Para reintentar, lanzar el workflow de nuevo a propósito. Termina con error
          # para que la corrida quede en rojo: puede haber un aviso que no salió.
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::No se envía: es una re-corrida (intento $GITHUB_RUN_ATTEMPT) y podría repetir avisos ya enviados; para reintentar, lanzar el workflow de nuevo"
            echo "motivo=es una re-corrida y podría repetir avisos ya enviados" >> "$GITHUB_OUTPUT"
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Comodidad, no seguridad: desde otra rama este mismo archivo se puede editar
          # y sacar estos chequeos. Lo que de verdad frena es la condición del proveedor
          # (ref == refs/heads/main, run_attempt == 1). Acá solo se evita un error de
          # autenticación ruidoso.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::warning::No se envía: el workflow no corre desde main y la credencial solo acepta main"
            echo "motivo=el workflow no corre desde main y la credencial solo acepta main" >> "$GITHUB_OUTPUT"
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Hasta que el dueño haga el paso 6 (identidad federada) estas variables no
          # existen: no es un error, solo no se puede enviar todavía.
          faltan=()
          [ -n "$WIF_PROVIDER" ] || faltan+=(GCP_WIF_PROVIDER)
          [ -n "$SA_EMAIL" ] || faltan+=(GCP_SA_EMAIL)
          [ -n "$PROYECTO" ] || faltan+=(FIREBASE_PROJECT_ID)
          if [ "${#faltan[@]}" -gt 0 ]; then
            echo "::warning::No se envía: faltan las variables del repositorio ${faltan[*]}"
            echo "motivo=faltan las variables del repositorio ${faltan[*]}" >> "$GITHUB_OUTPUT"
            echo "listo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Formatos antes de usarlos: el ID del proyecto va dentro de la URL de FCM.
          if ! [[ "$PROYECTO" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::FIREBASE_PROJECT_ID no tiene formato de ID de proyecto de Google Cloud"
            exit 1
          fi
          if ! [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]; then
            echo "::error::GCP_WIF_PROVIDER no tiene el formato projects/<número>/locations/global/workloadIdentityPools/<pool>/providers/<proveedor>"
            exit 1
          fi
          if ! [[ "$SA_EMAIL" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]; then
            echo "::error::GCP_SA_EMAIL no tiene formato de cuenta de servicio (<nombre>@<proyecto>.iam.gserviceaccount.com)"
            exit 1
          fi
          echo "listo=true" >> "$GITHUB_OUTPUT"

      # Paso 6, lo que pone el dueño en Google Cloud (la seguridad está ahí, no acá):
      # - Condición del proveedor:
      #     assertion.repository_id == '1412063651' &&
      #     assertion.repository_owner_id == '141058604' &&
      #     assertion.repository == 'MatiCascoV/rio-paysandu' &&
      #     assertion.ref == 'refs/heads/main' &&
      #     assertion.workflow_ref == 'MatiCascoV/rio-paysandu/.github/workflows/avisos.yml@refs/heads/main' &&
      #     assertion.event_name == 'workflow_dispatch' &&
      #     assertion.run_attempt == '1' &&
      #     assertion.runner_environment == 'github-hosted'
      #   (los *_id son números que GitHub no reusa: si el repositorio se borra, otro
      #   con el mismo nombre no entra; run_attempt == '1' rechaza las re-corridas, que
      #   repetirían avisos). Si el repositorio se renombra o transfiere, falla cerrado.
      # - La cuenta de servicio: un rol propio con solo cloudmessaging.messages.create
      #   (roles/firebasecloudmessaging.admin solo si no queda otra), y
      #   roles/iam.workloadIdentityUser para el principalSet
      #   .../attribute.repository_id/1412063651 de un pool exclusivo para esto. Nada más.
      - name: Autenticar en Google Cloud (identidad federada)
        id: auth
        if: steps.config.outputs.listo == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token
          # Solo el permiso de enviar por FCM, y por poco tiempo: los envíos son enseguida.
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 300s
          # El token queda solo en la salida del paso (enmascarada en el registro):
          # no se escribe ningún archivo de credenciales en el runner ni se exportan
          # variables de entorno que heredarían los pasos siguientes.
          create_credentials_file: false
          export_environment_variables: false

      - name: Enviar los avisos por FCM
        id: enviar
        if: steps.config.outputs.listo == 'true'
        timeout-minutes: 2
        env:
          TOKEN_FCM: ${{ steps.auth.outputs.access_token }}
          PROYECTO: ${{ vars.FIREBASE_PROJECT_ID }}
          PRUEBA: ${{ inputs.prueba }}
          URGENTE: ${{ needs.decidir.outputs.urgente }}
          RESUMEN: ${{ needs.decidir.outputs.resumen }}
          FUENTE: ${{ needs.decidir.outputs.fuente }}
        run: |
          # Nada de set -x: el token no se imprime nunca. Se pasa a una variable del
          # shell sin exportar, así no lo heredan curl, jq ni ningún otro proceso hijo.
          token="$TOKEN_FCM"
          unset TOKEN_FCM
          if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          # Otra vez los formatos (el paso de revisión ya los miró): de acá salen el
          # destino y los datos de los mensajes.
          if ! [[ "$URGENTE" =~ ^(alerta|evacuacion|ninguno)$ ]] \
            || ! [[ "$RESUMEN:$FUENTE" =~ ^(true:(prefectura|estacion)|false:ninguna)$ ]]; then
            echo "::error::La decisión que llegó de decidir no tiene el formato esperado"
            exit 1
          fi

          # Solo un "false" explícito va a los temas reales; cualquier otra cosa, a los
          # de prueba. Los temas salen de nombres fijos de acá, no de datos externos, y
          # cumplen el formato de temas de FCM ([a-zA-Z0-9-_.~%]+).
          if [ "$PRUEBA" = "false" ]; then prefijo=""; else prefijo="prueba-"; fi
          tema_alerta="${prefijo}alerta-paysandu"
          tema_evacuacion="${prefijo}evacuacion-paysandu"
          tema_resumen="${prefijo}resumen-paysandu"
          for tema in "$tema_alerta" "$tema_evacuacion" "$tema_resumen"; do
            if ! [[ "$tema" =~ ^[A-Za-z0-9_.~%-]+$ ]]; then
              echo "::error::El tema $tema no cumple el formato de FCM"
              exit 1
            fi
          done

          # Mensajes SOLO DE DATOS, sin notification, title ni body: este workflow nunca
          # manda texto, y la app solo muestra lo que dice actual.json. Ojo: eso no
          # protege contra un robo del token, que puede mandar un mensaje con texto a
          # cualquier tema; lo que acota un robo es que el token dura 300 s y solo existe
          # en este trabajo. jq arma el JSON (comillas y escapes incluidos); los valores
          # de data son textos, como pide FCM. Todos van a un tema directo, nunca a una
          # condición de FCM.
          # - Urgente alerta: un mensaje al tema de alerta.
          # - Urgente evacuación: DOS mensajes con los mismos datos, uno al tema de
          #   evacuación y otro al de alerta. La app deja cada teléfono en un solo tema
          #   urgente. Si quedara en los dos (sincronización a medias), le llegan dos
          #   pushes, pero la app no repite el aviso (ultimo_nivel). Antes era una
          #   condición ('alerta' in topics || 'evacuacion' in topics) y en la prueba
          #   del 21/10 tardó 42 s, contra menos de 1 s de un tema directo.
          # - Los urgentes, con prioridad alta para que Android despierte la app.
          # - Resumen: al tema de resumen, prioridad normal (no es urgente).
          cuerpo_evacuacion=""
          cuerpo_alerta=""
          cuerpo_resumen=""
          if [ "$URGENTE" != ninguno ]; then
            # El mismo nivel (alerta o evacuacion) en todos los mensajes urgentes.
            cuerpo_alerta=$(jq -n --arg tema "$tema_alerta" --arg nivel "$URGENTE" \
              '{message: {topic: $tema,
                          data: {tipo: "urgente", nivel: $nivel, ciudad: "paysandu"},
                          android: {priority: "HIGH"}}}')
          fi
          if [ "$URGENTE" = evacuacion ]; then
            cuerpo_evacuacion=$(jq -n --arg tema "$tema_evacuacion" \
              '{message: {topic: $tema,
                          data: {tipo: "urgente", nivel: "evacuacion", ciudad: "paysandu"},
                          android: {priority: "HIGH"}}}')
          fi
          if [ "$RESUMEN" = true ]; then
            cuerpo_resumen=$(jq -n --arg tema "$tema_resumen" --arg fuente "$FUENTE" \
              '{message: {topic: $tema,
                          data: {tipo: "resumen", fuente: $fuente, ciudad: "paysandu"},
                          android: {priority: "NORMAL"}}}')
          fi

          # Un envío: $1 = evacuacion|alerta|resumen (nombre de las salidas), $2 = tema
          # (para el registro y el resumen), $3 = cuerpo. Devuelve 0 si FCM lo aceptó.
          # destino_<clave> se escribe antes de mandar: si el paso se corta en el medio,
          # el resumen sabe que este mensaje se empezó a mandar.
          # El encabezado con el token entra por un descriptor (printf es interno de
          # bash), así no aparece en la línea de comandos de curl que ve cualquier proceso,
          # ni queda en ningún archivo. La respuesta de FCM (sin el token) va a RUNNER_TEMP,
          # fuera del workspace.
          # Sin reintentos: si se cortó después de que FCM lo aceptó, reintentar
          # duplicaría el aviso; la revisión local queda de respaldo.
          # Tiempos: 10 s para conectar y 15 s en total por mensaje (FCM contesta en
          # menos de 1 s); con tres mensajes son 45 s como máximo.
          enviar_uno() {
            local clave="$1" tema="$2" cuerpo="$3"
            local respuesta codigo=0 http nombre error
            echo "destino_$clave=topic $tema" >> "$GITHUB_OUTPUT"
            respuesta=$(mktemp -p "$RUNNER_TEMP")
            http=$(curl -sS --fail-with-body --connect-timeout 10 --max-time 15 \
              -X POST "https://fcm.googleapis.com/v1/projects/$PROYECTO/messages:send" \
              -H @<(printf 'Authorization: Bearer %s\n' "$token") \
              -H "Content-Type: application/json; charset=UTF-8" \
              --data-binary "$cuerpo" \
              -o "$respuesta" -w '%{http_code}') || codigo=$?
            [[ "$http" =~ ^[0-9]{3}$ ]] || http="?"

            # De la respuesta solo se guardan caracteres inofensivos y una línea: va a
            # GITHUB_OUTPUT y al resumen.
            if [ "$codigo" -eq 0 ]; then
              # || true: una respuesta que no es JSON no corta el paso (ni con pipefail).
              nombre=$(jq -r '.name // empty' "$respuesta" 2>/dev/null \
                | head -c 300 | tr -cd 'A-Za-z0-9/:._-') || true
              rm -f "$respuesta"
              echo "resultado_$clave=enviado (${nombre:-sin name en la respuesta})" >> "$GITHUB_OUTPUT"
              echo "Enviado el mensaje al tema $tema: ${nombre:-sin name en la respuesta}"
              return 0
            fi
            # Sin respuesta HTTP no se sabe si FCM lo recibió: tiempo agotado (28),
            # respuesta vacía (52), error al mandar (55) o al recibir (56), o cualquier
            # otro corte sin código HTTP (000). Salvo que no se haya podido ni
            # resolver el nombre (6) ni conectar (7): ahí seguro que no salió. Cuenta
            # como falla (la corrida queda en rojo) y no se reintenta.
            if { [[ "$codigo" =~ ^(28|52|55|56)$ ]] || [ "$http" = 000 ]; } \
              && ! [[ "$codigo" =~ ^(6|7)$ ]]; then
              rm -f "$respuesta"
              echo "resultado_$clave=no se sabe si salió (curl $codigo, sin respuesta HTTP)" >> "$GITHUB_OUTPUT"
              echo "::error::No se sabe si el mensaje al tema $tema salió (curl $codigo, sin respuesta HTTP); no se reintenta para no duplicarlo"
              return 1
            fi
            # Solo el código HTTP y el error que devuelve FCM, recortado a una línea;
            # nunca encabezados ni el token.
            error=$(jq -r '.error | "\(.status // "") \(.message // "")"' "$respuesta" 2>/dev/null \
              | head -c 300 | tr -cd 'A-Za-z0-9 .,:;_()/-') || true
            rm -f "$respuesta"
            echo "resultado_$clave=falló (curl $codigo, HTTP $http: ${error:-sin detalle})" >> "$GITHUB_OUTPUT"
            echo "::error::El envío al tema $tema falló (curl $codigo, HTTP $http): ${error:-sin detalle}"
            return 1
          }

          # Primero los urgentes, después el resumen, cada mensaje una sola vez. Con
          # evacuación, primero el tema de evacuación: quien eligió "Solo evacuación" no
          # recibió ningún aviso antes, y quien está en alerta ya tuvo el de alerta.
          # Si un mensaje falla igual se intentan los demás (son temas distintos; si un
          # teléfono quedara en los dos temas urgentes, la app no repite el aviso) y al
          # final el paso falla: la corrida queda en rojo y el resumen dice cuál salió,
          # cuál no y de cuál no se sabe.
          fallos=0
          if [ -n "$cuerpo_evacuacion" ]; then
            enviar_uno evacuacion "$tema_evacuacion" "$cuerpo_evacuacion" || fallos=$((fallos + 1))
          fi
          if [ -n "$cuerpo_alerta" ]; then
            enviar_uno alerta "$tema_alerta" "$cuerpo_alerta" || fallos=$((fallos + 1))
          fi
          if [ -n "$cuerpo_resumen" ]; then
            enviar_uno resumen "$tema_resumen" "$cuerpo_resumen" || fallos=$((fallos + 1))
          fi
          unset token
          if [ "$fallos" -gt 0 ]; then
            exit 1
          fi

      # Qué se mandó a qué destino, en todas las salidas de este trabajo (también si
      # algo falló o se canceló). Si "enviar" ni arrancó, el resumen de "decidir" ya
      # dice por qué.
      - name: Resumen
        if: always()
        env:
          RESULTADO_CONFIG: ${{ steps.config.outcome }}
          MOTIVO_CONFIG: ${{ steps.config.outputs.motivo }}
          RESULTADO_AUTH: ${{ steps.auth.outcome }}
          RESULTADO_ENVIAR: ${{ steps.enviar.outcome }}
          PRUEBA: ${{ inputs.prueba }}
          URGENTE: ${{ needs.decidir.outputs.urgente }}
          RESUMEN: ${{ needs.decidir.outputs.resumen }}
          DESTINO_EVACUACION: ${{ steps.enviar.outputs.destino_evacuacion }}
          RESULTADO_EVACUACION: ${{ steps.enviar.outputs.resultado_evacuacion }}
          DESTINO_ALERTA: ${{ steps.enviar.outputs.destino_alerta }}
          RESULTADO_ALERTA: ${{ steps.enviar.outputs.resultado_alerta }}
          DESTINO_RESUMEN: ${{ steps.enviar.outputs.destino_resumen }}
          RESULTADO_RESUMEN: ${{ steps.enviar.outputs.resultado_resumen }}
        run: |
          # Los temas, con la misma regla que el paso de envío: solo un "false"
          # explícito va a los temas reales.
          if [ "$PRUEBA" = "false" ]; then prefijo=""; else prefijo="prueba-"; fi
          tema_evacuacion="${prefijo}evacuacion-paysandu"
          tema_alerta="${prefijo}alerta-paysandu"
          tema_resumen="${prefijo}resumen-paysandu"

          # Lo que no tiene el formato esperado no se copia al resumen. Cada destino
          # tiene un único valor posible; los resultados los arma el paso de envío solo
          # con caracteres inofensivos.
          [[ "$URGENTE" =~ ^(alerta|evacuacion|ninguno)$ ]] || URGENTE="inválido"
          [[ "$RESUMEN" =~ ^(true|false)$ ]] || RESUMEN="inválido"
          [ "$DESTINO_EVACUACION" = "topic $tema_evacuacion" ] || DESTINO_EVACUACION=""
          [ "$DESTINO_ALERTA" = "topic $tema_alerta" ] || DESTINO_ALERTA=""
          [ "$DESTINO_RESUMEN" = "topic $tema_resumen" ] || DESTINO_RESUMEN=""

          # Lo que pasó con un mensaje: $1 = destino, $2 = resultado del envío.
          contar() {
            if [ -n "$2" ]; then
              echo "$2"
            elif [ -n "$1" ]; then
              echo "no se sabe: el paso de envío se cortó antes de terminar este mensaje"
            elif [ "$RESULTADO_ENVIAR" = failure ]; then
              echo "no: el paso de envío falló antes de mandarlo"
            elif [ -n "$MOTIVO_CONFIG" ]; then
              echo "no: $MOTIVO_CONFIG"
            elif [ "$RESULTADO_CONFIG" != success ]; then
              echo "no: la decisión o la configuración de envío es inválida"
            elif [ "$RESULTADO_AUTH" != success ]; then
              echo "no: falló la autenticación en Google Cloud"
            else
              echo "no: el trabajo se cortó antes de enviar"
            fi
          }

          # Una línea por mensaje: $1 = tema, $2 = destino, $3 = resultado del envío.
          mensaje() {
            echo "  - Tema \`$1\`: $(contar "$2" "$3")"
          }

          {
            echo "### Envío"
            echo
            case "$URGENTE" in
              ninguno)
                echo "- Urgente: no corresponde" ;;
              alerta)
                echo "- Urgente (alerta), un mensaje:"
                mensaje "$tema_alerta" "$DESTINO_ALERTA" "$RESULTADO_ALERTA" ;;
              evacuacion)
                echo "- Urgente (evacuacion), dos mensajes con los mismos datos, uno por tema urgente:"
                mensaje "$tema_evacuacion" "$DESTINO_EVACUACION" "$RESULTADO_EVACUACION"
                mensaje "$tema_alerta" "$DESTINO_ALERTA" "$RESULTADO_ALERTA" ;;
              *)
                echo "- Urgente: no: la decisión que llegó de decidir es inválida" ;;
            esac
            case "$RESUMEN" in
              false)
                echo "- Resumen del día: no corresponde" ;;
              true)
                echo "- Resumen del día, un mensaje:"
                mensaje "$tema_resumen" "$DESTINO_RESUMEN" "$RESULTADO_RESUMEN" ;;
              *)
                echo "- Resumen del día: no: la decisión que llegó de decidir es inválida" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
